version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: chat-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: chat_root
      MONGO_INITDB_ROOT_PASSWORD: chat_password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
