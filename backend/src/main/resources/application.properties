spring.application.name=weechat-backend

spring.mongodb.host=localhost
spring.mongodb.port=21345
spring.mongodb.authentication-database=admin
spring.mongodb.username=weechat_root
spring.mongodb.password=weechat_password
spring.mongodb.database=weechat

spring.datasource.url=jdbc:postgresql://localhost:54321/weechat_db
spring.datasource.username=weechat_user
spring.datasource.password=weechat_password

spring.flyway.baseline-on-migrate=true

security.jwt.secret=change-me
security.jwt.access-expiration-seconds=300
security.jwt.refresh-expiration-seconds=2592000

media.base-url.avatar=http://localhost:8080/media/avatars
media.base-url.image=http://localhost:8080/media/images
media.base-url.file=http://localhost:8080/media/files
media.base-url.audio=http://localhost:8080/media/audio
media.base-url.video=http://localhost:8080/media/video
