version: "3.9"

services:
  backend:
    build:
      context: ../backend
    container_name: chat-backend
    restart: unless-stopped
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/weechat_db
      POSTGRES_USERNAME: weechat_user
      POSTGRES_PASSWORD: weechat_password
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_AUTH_DB: admin
      MONGO_USERNAME: weechat_root
      MONGO_PASSWORD: weechat_password
      MONGO_DATABASE: weechat
      JWT_SECRET: change-me
      PL_GUARD_BASE_URL: http://pl-guard:8000
      PL_GUARD_TIMEOUT_MS: "10000"
      MEDIA_BASE_URL_AVATAR: http://localhost:8080/media/avatars
      MEDIA_BASE_URL_IMAGE: http://localhost:8080/media/images
      MEDIA_BASE_URL_FILE: http://localhost:8080/media/files
      MEDIA_BASE_URL_AUDIO: http://localhost:8080/media/audio
      MEDIA_BASE_URL_VIDEO: http://localhost:8080/media/video
    depends_on:
      - postgres
      - mongo
      - pl-guard
    networks:
      - private
      - public
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16
    container_name: chat-postgres-weechat
    restart: unless-stopped
    environment:
      POSTGRES_USER: weechat_user
      POSTGRES_PASSWORD: weechat_password
      POSTGRES_DB: weechat_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
      - public
    ports:
      - "54322:5432"

  mongo:
    image: mongo:7
    container_name: chat-mongo-weechat
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: weechat_root
      MONGO_INITDB_ROOT_PASSWORD: weechat_password
    volumes:
      - mongo_data:/data/db
      - ../data/seed/mongo_seed.js:/docker-entrypoint-initdb.d/mongo_seed.js:ro
    networks:
      - private

  pl-guard:
    build: ./pl-guard
    container_name: pl-guard-weechat
    restart: unless-stopped
    environment:
      HF_MODEL_ID: "NASK-PIB/HerBERT-PL-Guard"
      HF_TOKEN: "${HF_TOKEN}"
      WORKERS: "1"
      LOG_LEVEL: "info"
    volumes:
      - hf-cache:/root/.cache/huggingface
    networks:
      - private
      - public

  nginx-frontend:
    image: nginx:1.27
    container_name: chat-nginx-frontend
    restart: unless-stopped
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - public
    ports:
      - "8081:80"

  nginx-cdn:
    image: nginx:1.27
    container_name: chat-nginx-cdn
    restart: unless-stopped
    volumes:
      - ./nginx/cdn:/usr/share/nginx/html:ro
    networks:
      - public
    ports:
      - "8082:80"

volumes:
  postgres_data:
  mongo_data:
  hf-cache:

networks:
  private:
    driver: bridge
    internal: true
  public:
    driver: bridge
