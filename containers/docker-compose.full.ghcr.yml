version: "3.9"

services:
  backend:
    image: ghcr.io/dersivative/weechat-backend:latest
    container_name: chat-backend
    restart: unless-stopped
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/weechat_db
      POSTGRES_USERNAME: weechat_user
      POSTGRES_PASSWORD: weechat_password
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_AUTH_DB: admin
      MONGO_USERNAME: weechat_root
      MONGO_PASSWORD: weechat_password
      MONGO_DATABASE: weechat
      JWT_SECRET: change-me
      PL_GUARD_BASE_URL: http://pl-guard:8000
      PL_GUARD_TIMEOUT_MS: "10000"
      MEDIA_BASE_URL_AVATAR: http://cdn.${BASE_APP_URL}/media/avatars
      MEDIA_BASE_URL_IMAGE: http://cdn.${BASE_APP_URL}/media/images
      MEDIA_BASE_URL_FILE: http://cdn.${BASE_APP_URL}/media/files
      MEDIA_BASE_URL_AUDIO: http://cdn.${BASE_APP_URL}/media/audio
      MEDIA_BASE_URL_VIDEO: http://cdn.${BASE_APP_URL}/media/video
      CORS_ALLOWED_ORIGINS: http://${BASE_APP_URL},https://${BASE_APP_URL}
    depends_on:
      - postgres
      - mongo
      - pl-guard
    networks:
      - private

  postgres:
    image: postgres:16
    container_name: chat-postgres-weechat
    restart: unless-stopped
    environment:
      POSTGRES_USER: weechat_user
      POSTGRES_PASSWORD: weechat_password
      POSTGRES_DB: weechat_db
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
      - public

    
  mongo:
    image: mongo:7
    container_name: chat-mongo-weechat
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: weechat_root
      MONGO_INITDB_ROOT_PASSWORD: weechat_password
    volumes:
      - mongo_data:/data/db
      - ../data/seed/mongo_seed.js:/docker-entrypoint-initdb.d/mongo_seed.js:ro
    ports:
      - "21345:27017"
    networks:
      - private
      - public

  pl-guard:
    image: ghcr.io/dersivative/weechat-pl-guard:latest
    container_name: pl-guard-weechat
    restart: unless-stopped
    environment:
      HF_MODEL_ID: "NASK-PIB/HerBERT-PL-Guard"
      HF_TOKEN: "${HF_TOKEN}"
      WORKERS: "1"
      LOG_LEVEL: "info"
    volumes:
      - hf-cache:/root/.cache/huggingface
    networks:
      - private
      - public

  nginx-init:
    image: alpine:3.20
    container_name: chat-nginx-init
    restart: "no"
    command: ["sh", "-c", "mkdir -p /nginx/html /nginx/cdn"]
    volumes:
      - ./nginx:/nginx

  nginx-edge:
    image: nginx:1.27
    container_name: nginx-edge
    restart: unless-stopped
    depends_on:
      - nginx-init
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - public
      - private
    environment:
      BASE_APP_URL: "${BASE_APP_URL}"
      SSL_CERT_PATH: "${SSL_CERT_PATH}"
      SSL_KEY_PATH: "${SSL_KEY_PATH}"
    ports:
      - "80:80"
      - "443:443"
    command:
      [
        "sh",
        "-c",
        "envsubst < /etc/nginx/templates/app-http.conf.template > /etc/nginx/conf.d/app-http.conf; if [ -n \"$SSL_CERT_PATH\" ] && [ -n \"$SSL_KEY_PATH\" ]; then envsubst < /etc/nginx/templates/app-https.conf.template > /etc/nginx/conf.d/app-https.conf; fi; exec nginx -g 'daemon off;'"
      ]

  nginx-cdn:
    image: nginx:1.27
    container_name: chat-nginx-cdn
    restart: unless-stopped
    depends_on:
      - nginx-init
    volumes:
      - ./nginx/cdn:/usr/share/nginx/html:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - private
    environment:
      BASE_APP_URL: "${BASE_APP_URL}"
      SSL_CERT_PATH: "${SSL_CERT_PATH}"
      SSL_KEY_PATH: "${SSL_KEY_PATH}"
    command:
      [
        "sh",
        "-c",
        "envsubst < /etc/nginx/templates/cdn-http.conf.template > /etc/nginx/conf.d/cdn-http.conf; if [ -n \"$SSL_CERT_PATH\" ] && [ -n \"$SSL_KEY_PATH\" ]; then envsubst < /etc/nginx/templates/cdn-https.conf.template > /etc/nginx/conf.d/cdn-https.conf; fi; exec nginx -g 'daemon off;'"
      ]

volumes:
  postgres_data:
  mongo_data:
  hf-cache:

networks:
  private:
    driver: bridge
    internal: true
  public:
    driver: bridge
